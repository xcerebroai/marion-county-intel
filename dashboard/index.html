<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Marion Intel | Distress Signal Intelligence</title>
<style>
:root{
  --black:#0A0A0A; --midnight:#0F172A; --blue:#3B82F6; --blue-lt:#60A5FA;
  --soft:#E5E7EB; --dark:#1F2937;
  --bg:#0A0A0A; --panel:#0F172A; --panel2:#131C31; --line:rgba(229,231,235,.09);
  --line2:rgba(229,231,235,.15); --muted:#94A3B8; --muted2:#64748B;
  --amber:#F59E0B; --red:#EF4444; --green:#10B981;
  --font:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --h-head:64px; --h-cov:44px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
/* The page header and the table head are both sticky. Without scroll padding a
   row scrolled to can land underneath them, which makes its controls
   unclickable — caught by the control audit on the first row's View button. */
html{scroll-padding-top:calc(var(--h-head) + 52px)}
html,body{max-width:100%;overflow-x:hidden}
body{background:var(--bg);color:var(--soft);font-family:var(--font);font-size:16px;
  line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select{font-family:var(--font);font-size:14px}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}

/* ── HEADER ── */
.hd{height:var(--h-head);position:sticky;top:0;z-index:60;background:rgba(10,10,10,.96);
  backdrop-filter:blur(10px);border-bottom:1px solid var(--line);
  display:flex;align-items:center;justify-content:space-between;padding:0 20px;gap:16px}
.hd-l{display:flex;align-items:center;gap:10px;min-width:0}
.mark{width:30px;height:30px;border-radius:7px;flex:none;
  background:linear-gradient(135deg,var(--blue),var(--blue-lt));
  display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:15px}
.wordmark{font-size:16px;font-weight:700;letter-spacing:-.01em;color:#fff;white-space:nowrap}
.tag{font-size:10px;font-weight:600;letter-spacing:.09em;color:var(--blue-lt);
  border:1px solid rgba(59,130,246,.4);border-radius:4px;padding:2px 6px;white-space:nowrap}
.hd-r{display:flex;align-items:center;gap:12px}
.stamp{font-size:12px;color:var(--muted);white-space:nowrap}
.btn{background:var(--blue);color:#fff;border:none;border-radius:7px;padding:9px 14px;
  font-size:14px;font-weight:600;cursor:pointer;white-space:nowrap;transition:background .15s}
.btn:hover{background:var(--blue-lt)}
.btn-q{background:transparent;border:1px solid var(--line2);color:var(--soft);
  border-radius:7px;padding:8px 12px;font-size:13px;font-weight:500;cursor:pointer}
.btn-q:hover{border-color:var(--blue);color:var(--blue-lt)}

/* ── COVERAGE ── */
.cov{min-height:var(--h-cov);background:rgba(245,158,11,.09);
  border-bottom:1px solid rgba(245,158,11,.22);display:flex;align-items:center;
  gap:9px;padding:0 20px}
.cov svg{flex:none;color:var(--amber)}
.cov p{font-size:13.5px;color:#F3D3A0;flex:1;min-width:0;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.cov button{background:none;border:none;color:var(--amber);font-size:13px;font-weight:600;
  cursor:pointer;text-decoration:underline;white-space:nowrap;padding:0}

/* ── KPI ── */
.kpi{display:grid;grid-template-columns:repeat(4,1fr);border-bottom:1px solid var(--line);
  background:var(--panel);height:88px}
.kpi div{padding:0 20px;border-right:1px solid var(--line);display:flex;
  flex-direction:column;justify-content:center;gap:2px}
.kpi div:last-child{border-right:none}
.kpi .v{font-size:24px;font-weight:700;line-height:1.1;color:#fff;font-variant-numeric:tabular-nums}
.kpi .l{font-size:11.5px;line-height:1.2;color:var(--muted);letter-spacing:.05em;
  text-transform:uppercase;font-weight:600}

/* ── SHELL ── */
.wrap{padding:16px 20px 40px}

/* ── TABS ── */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:14px}
.tab{background:none;border:none;border-bottom:2px solid transparent;color:var(--muted);
  padding:9px 14px;font-size:14.5px;font-weight:600;cursor:pointer;display:flex;
  align-items:center;gap:7px;margin-bottom:-1px}
.tab:hover{color:var(--soft)}
.tab[aria-selected="true"]{color:#fff;border-bottom-color:var(--blue)}
.tab .n{background:var(--dark);color:var(--muted);border-radius:9px;padding:1px 7px;
  font-size:11.5px;font-weight:600;font-variant-numeric:tabular-nums}
.tab[aria-selected="true"] .n{background:var(--blue);color:#fff}

/* ── TOOLBAR ── */
/* One uniform control height keeps the toolbar on a single visual baseline —
   mixed intrinsic heights on input/select/button otherwise stagger them. */
.bar{display:flex;gap:8px;align-items:stretch;flex-wrap:nowrap;margin-bottom:10px}
.bar>*{height:38px}
.bar input,.bar select,.bar button{height:38px;padding-top:0;padding-bottom:0}
.srch{position:relative;flex:1 1 260px;min-width:180px}
.srch svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--muted2)}
.srch input{width:100%;background:var(--panel);border:1px solid var(--line2);color:var(--soft);
  border-radius:7px;padding:9px 10px 9px 32px;font-size:14px;outline:none}
.srch input:focus{border-color:var(--blue)}
.srch input::placeholder{color:var(--muted2)}
.sel{background:var(--panel);border:1px solid var(--line2);color:var(--soft);border-radius:7px;
  padding:9px 9px;outline:none;cursor:pointer;max-width:170px}
.sel:focus{border-color:var(--blue)}
.num{background:var(--panel);border:1px solid var(--line2);color:var(--soft);border-radius:7px;
  padding:9px 8px;width:92px;outline:none}
.num:focus{border-color:var(--blue)}
.tgl{background:var(--panel);border:1px solid var(--line2);color:var(--muted);border-radius:7px;
  padding:9px 12px;font-size:13px;font-weight:500;cursor:pointer;white-space:nowrap}
.tgl[aria-pressed="true"]{background:var(--blue);border-color:var(--blue);color:#fff}
.cnt{font-size:13px;color:var(--muted);margin-bottom:10px}
.cnt b{color:#fff;font-weight:600}

/* ── TABLE ── */
/* NOTE: no overflow on this wrapper. overflow:hidden would make it the sticky
   containing block, and `thead th{top:var(--h-head)}` would then push every
   header cell 64px DOWN onto the first row instead of parking it under the page
   header — which made row 1's controls unclickable. Corners are rounded on the
   edge cells instead. */
.tbl-wrap{border:1px solid var(--line);border-radius:9px;background:var(--panel)}
thead th:first-child{border-top-left-radius:9px}
thead th:last-child{border-top-right-radius:9px}
tbody tr:last-child td{border-bottom:none}
tbody tr:last-child td:first-child{border-bottom-left-radius:9px}
tbody tr:last-child td:last-child{border-bottom-right-radius:9px}
table{width:100%;border-collapse:collapse;table-layout:fixed}
thead th{position:sticky;top:var(--h-head);z-index:20;background:var(--panel2);
  color:var(--muted);text-align:left;font-size:11.5px;font-weight:600;letter-spacing:.05em;
  text-transform:uppercase;padding:10px 12px;border-bottom:1px solid var(--line2);
  white-space:nowrap;user-select:none}
thead th.s{cursor:pointer}
thead th.s:hover{color:var(--blue-lt)}
thead th .ar{color:var(--blue);margin-left:3px}
tbody td{padding:11px 12px;border-bottom:1px solid rgba(229,231,235,.05);vertical-align:middle;
  font-size:14px;overflow:hidden}
tbody tr{height:68px;scroll-margin-top:calc(var(--h-head) + 56px)}
tbody tr:nth-child(even){background:rgba(255,255,255,.012)}
tbody tr:hover{background:rgba(59,130,246,.07)}
.num-c{font-variant-numeric:tabular-nums;white-space:nowrap}
.trunc{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.clamp2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  line-height:1.3;max-height:2.6em;word-break:break-word}
.badge{display:inline-block;padding:2px 8px;border-radius:5px;font-size:11.5px;font-weight:600;
  white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.sub{font-size:11.5px;color:var(--muted2);margin-top:3px}
.addr1{font-size:14px;color:var(--soft)}
.addr2{font-size:12px;color:var(--muted)}
.pcl{font-size:11px;color:var(--muted2);font-variant-numeric:tabular-nums}
.stk{display:inline-block;min-width:26px;text-align:center;border-radius:11px;padding:2px 8px;
  font-size:12px;font-weight:700;background:var(--dark);color:var(--muted)}
.stk.on{background:rgba(59,130,246,.18);color:var(--blue-lt)}
.stk.hot{background:rgba(239,68,68,.18);color:#FCA5A5}
.new{display:inline-block;background:var(--blue);color:#fff;border-radius:4px;
  padding:1px 6px;font-size:10px;font-weight:700;letter-spacing:.05em;margin-left:6px;
  vertical-align:middle}
.view{background:transparent;border:1px solid var(--line2);color:var(--soft);border-radius:6px;
  padding:5px 11px;font-size:12.5px;font-weight:600;cursor:pointer;white-space:nowrap}
.view:hover{border-color:var(--blue);color:var(--blue-lt)}
.empty{padding:56px 20px;text-align:center;color:var(--muted)}

/* ── PAGINATION ── */
.pg{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 2px;
  flex-wrap:wrap}
.pg-b{display:flex;gap:5px;align-items:center}
.pbtn{background:var(--panel);border:1px solid var(--line2);color:var(--soft);border-radius:6px;
  padding:6px 11px;font-size:13px;cursor:pointer;min-width:36px}
.pbtn:hover:not(:disabled){border-color:var(--blue);color:var(--blue-lt)}
.pbtn:disabled{opacity:.35;cursor:not-allowed}
.pg-i{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}

/* ── DRAWER ── */
.scrim{position:fixed;inset:0;background:rgba(10,10,10,.62);z-index:90;opacity:0;
  pointer-events:none;transition:opacity .18s}
.scrim.on{opacity:1;pointer-events:auto}
/* Closed drawer is visibility:hidden as well as translated off-screen, so it
   cannot take focus or be read by a screen reader while closed. */
.dr{position:fixed;top:0;right:0;bottom:0;width:min(480px,100%);background:var(--panel);
  border-left:1px solid var(--line2);z-index:95;transform:translateX(100%);
  visibility:hidden;transition:transform .2s ease,visibility 0s linear .2s;
  display:flex;flex-direction:column}
.dr.on{transform:translateX(0);visibility:visible;transition:transform .2s ease}
.dr-h{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;
  padding:18px 20px;border-bottom:1px solid var(--line)}
.dr-t{font-size:17px;font-weight:700;color:#fff;line-height:1.3}
.dr-x{background:none;border:none;color:var(--muted);font-size:22px;cursor:pointer;
  line-height:1;padding:2px 6px;border-radius:6px}
.dr-x:hover{color:#fff;background:var(--dark)}
.dr-b{padding:16px 20px 32px;overflow-y:auto;flex:1}
.grp{margin-bottom:20px}
.grp h4{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;
  color:var(--muted2);margin-bottom:8px}
.kv{display:grid;grid-template-columns:132px 1fr;gap:5px 12px;font-size:13.5px}
.kv dt{color:var(--muted)}
.kv dd{color:var(--soft);word-break:break-word}
.sig{border-left:2px solid var(--line2);padding:8px 0 8px 11px;margin-bottom:8px}
.sig .r1{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin-bottom:3px}
.sig .r2{font-size:12px;color:var(--muted)}

/* ── MODAL ── */
.mdl{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;
  padding:20px}
.mdl.on{display:flex}
.mdl-c{background:var(--panel);border:1px solid var(--line2);border-radius:11px;
  max-width:720px;width:100%;max-height:80vh;overflow-y:auto;padding:22px}
.cov-i{border-left:3px solid var(--line2);padding:9px 0 9px 12px;margin-bottom:14px}
.cov-i .lv{font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.cov-i h5{font-size:14px;font-weight:600;color:#fff;margin:2px 0 4px}
.cov-i p{font-size:13px;color:var(--muted);line-height:1.55}

/* ── MOBILE CARDS ── */
.cards{display:none}
.card{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:14px;
  margin-bottom:10px}
.card .c1{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;
  margin-bottom:9px}
.card .c-addr{font-size:15px;font-weight:600;color:#fff}
.card .c-r{display:flex;justify-content:space-between;font-size:13px;padding:3px 0}
.card .c-r span:first-child{color:var(--muted)}
.mob-only{display:none}

/* ── RESPONSIVE ── */
@media(max-width:1180px){
  .col-amt{display:none}
}
@media(max-width:980px){
  .col-date{display:none}
  .bar{flex-wrap:wrap}
  .srch{flex:1 1 100%}
  .sel,.num{max-width:none;flex:1 1 auto}
}
@media(max-width:760px){
  .kpi{grid-template-columns:repeat(2,1fr);height:auto}
  .kpi div{padding:12px 16px;border-bottom:1px solid var(--line)}
  .kpi div:nth-child(2){border-right:none}
  .kpi .v{font-size:20px}
  .tbl-wrap,.pg{display:none}
  .cards{display:block}
  .mob-only{display:inline-flex}
  .wrap{padding:14px 14px 32px}
  .hd{padding:0 14px}
  .cov{padding:8px 14px;align-items:flex-start}
  .cov p{white-space:normal}
  .stamp{display:none}
  .bar{display:none}
  /* The filter panel must WRAP on a phone. Left as nowrap it overflows 390px,
     and because the controls carry min-widths the whole document ends up
     scrolled sideways even with overflow-x:hidden on body. */
  .bar.open{display:flex;flex-wrap:wrap;gap:8px}
  .bar.open>*{flex:1 1 100%;height:42px;min-width:0;max-width:none}
  .bar.open .srch{flex:1 1 100%}
  .bar.open #avMin,.bar.open #avMax{flex:1 1 calc(50% - 4px)}
  .bar.open #tStack,.bar.open #btnClear{flex:1 1 calc(50% - 4px)}
  .btn,.btn-q,.view,.pbtn{min-height:40px}
  .hd{gap:8px}
  .wordmark{font-size:15px}
  .btn{padding:9px 11px;font-size:13px}
  .tag{display:none}   /* no room beside the export button at phone widths */
  /* The tab row plus the Filters button does not fit 390px on one line; without
     wrapping the button lands outside the viewport and the whole document
     becomes horizontally scrollable. */
  .tabs{flex-wrap:wrap;gap:2px}
  .tab{padding:8px 10px;font-size:13.5px}
  #btnFilters{margin-left:0!important;width:100%;margin:6px 0 2px}
}
</style>
</head>

    <button class="btn-q" id="btnClear">Clear</button>

  <div class="cnt" id="cnt"></div>

  <div class="tbl-wrap">
    <table>
      <colgroup id="cg"></colgroup>
      <thead><tr id="th"></tr></thead>

  <div class="pg">

    <div class="pg-b" id="pgb"></div>

        <select class="sel" id="per" style="padding:5px 7px;margin-left:5px">

<div class="mdl" id="mdl" role="dialog" aria-modal="true" aria-labelledby="mdlT">

</div>

function daysSince(iso){
  if(!iso) return 1e9;
  const d = new Date(iso + 'T00:00:00Z');
  if(isNaN(d)) return 1e9;
  return Math.floor((_today - d) / 86400000);
}
const isNew = r => daysSince(r.fs) <= NEW_DAYS;

/* ── coverage banner: derived from the per-source levels, never hand-written,

(function(){
  const lab=k=>SL[k]||k;
  const frozen=Object.keys(COV).filter(k=>COV[k].level==='frozen').map(lab);
  const capped=Object.keys(COV).filter(k=>COV[k].level==='capped').map(lab);
  const partial=Object.keys(COV).filter(k=>COV[k].level==='partial').map(lab);
  const parts=[];
  if(capped.length)  parts.push(`${capped.join(', ')} truncated by the source — counts are floors`);
  if(frozen.length)  parts.push(`${frozen.join(', ')} is a frozen extract, not current`);
  if(partial.length) parts.push(`${partial.join(', ')} window-limited`);
  $('covLine').textContent = parts.length

})();

      if(t && r.reason!==t) return false;
      if(s && r.src!==s) return false;
      if(q){const h=[r.reason,r.src,r.ref,r.cand,r.method,r.detail].join(' ').toLowerCase();
        if(!h.includes(q)) return false;}
      return true;});
  } else if(view==='stacked'){
    rows=STACK_ROWS.filter(r=>{
      if(t && !r.sigs.some(x=>x.t===t)) return false;
      if(s && !r.sigs.some(x=>x.s===s)) return false;
      if(!isNaN(mn) && !(r.av>=mn)) return false;
      if(!isNaN(mx) && !(r.av<=mx)) return false;
      if(q){const h=[r.p,r.pl,r.a,r.o,...r.types].join(' ').toLowerCase();
        if(!h.includes(q)) return false;}
      return true;});
  } else {
    rows=R.filter(r=>{
      if(t && r.t!==t) return false;
      if(s && r.s!==s) return false;
      if(stackOnly && !(r.st>1)) return false;
      if(newOnly && !isNew(r)) return false;
      if(!isNaN(mn) && !(r.av>=mn)) return false;
      if(!isNaN(mx) && !(r.av<=mx)) return false;
      if(q){const h=[r.o,r.a,r.p,r.pl,r.inst,r.lt,r.sl,r.note].join(' ').toLowerCase();
        if(!h.includes(q)) return false;}
      return true;});
  }
  const k=sortKey, dir=sortDir==='asc'?1:-1;
  if(k){
    rows.sort((a,b)=>{
      let x=a[k], y=b[k];
      if(typeof x==='number'||typeof y==='number'){
        const d0=((x||0)-(y||0))*dir; if(d0) return d0;
      } else {
        const c=String(x==null?'':x).localeCompare(String(y==null?'':y))*dir;
        if(c) return c;
      }
      // Tiebreak within a first_seen cohort: more signals on the parcel first,
      // then most recent filing. No score exists in this build.
      if(view==='signals'){
        const s=(b.st||0)-(a.st||0); if(s) return s;
        return String(b.d||'').localeCompare(String(a.d||''));
      }
      return 0;});
  }
  const noun=view==='review'?'review items':view==='stacked'?'stacked parcels':'signals';
  const tot=view==='review'?RV.length:view==='stacked'?STACK_ROWS.length:R.length;
  $('cnt').innerHTML=`Showing <b>${nf(rows.length)}</b> of ${nf(tot)} ${noun}`+
    (view==='stacked'?` · deepest stack <b>${DEEPEST}</b> signals`:'');
  const maxP=Math.max(1,Math.ceil(rows.length/per));
  if(page>maxP) page=maxP;
  render();
}

function head(){
  const cs=COLS[view];
  $('cg').innerHTML=cs.map(c=>`<col style="width:${c.w}"${c.cls?` class="${c.cls}"`:''}>`).join('');
  $('th').innerHTML=cs.map((c,i)=>{
    const ar=(c.k&&c.k===sortKey)?`<span class="ar">${sortDir==='asc'?'▲':'▼'}</span>`:'';
    return `<th class="${c.s?'s':''}${c.cls?' '+c.cls:''}"${c.s?` data-k="${c.k}" tabindex="0" role="button"`:''}>${esc(c.h)}${ar}</th>`;
  }).join('');
}

function render(){
  head();
  const st=(page-1)*per, pg=rows.slice(st,st+per);
  const tb=$('tb'), cards=$('cards');
  if(!pg.length){
    tb.innerHTML=`<tr><td colspan="${COLS[view].length}"><div class="empty">No records match these filters.</div></td></tr>`;
    cards.innerHTML=`<div class="empty">No records match these filters.</div>`;
    pager(); return;
  }
  if(view==='signals')      {tb.innerHTML=pg.map(rowSignal).join(''); cards.innerHTML=pg.map(cardSignal).join('');}
  else if(view==='stacked') {tb.innerHTML=pg.map(rowStack).join('');  cards.innerHTML=pg.map(cardStack).join('');}
  else                      {tb.innerHTML=pg.map(rowReview).join(''); cards.innerHTML=pg.map(cardReview).join('');}
  pager();
}

const idxOf=(r)=>rows.indexOf(r);
function rowSignal(r,i){
  const gi=(page-1)*per+i;
  return `<tr>
    <td><span class="badge" style="background:rgba(255,255,255,.06);color:${GC[r.g]||GC.other}">${esc(r.lt)}</span>${isNew(r)?'<span class="new">NEW</span>':''}
        <div class="sub">${esc(r.sl)}${r.bf?' · backfill':''}</div></td>
    <td><div class="addr1 trunc">${esc(r.a||'—')}</div>
        <div class="addr2 trunc">Indianapolis, IN ${esc(r.z||'')}</div>
        <div class="pcl trunc">${esc(r.p||'')}</div></td>
    <td><div class="clamp2">${esc(r.o||'—')}</div></td>
    <td class="num-c col-date">${esc(r.d||'—')}</td>
    <td class="num-c">${money(r.av)}</td>
    <td class="num-c col-amt">${money(r.amt)}</td>
    <td><span class="stk ${r.st>=4?'hot':r.st>1?'on':''}">${r.st}</span></td>
    <td><button class="view" data-i="${gi}">View</button></td></tr>`;
}
function rowStack(r,i){
  const gi=(page-1)*per+i;
  const tw=r.types.slice(0,3).map(t=>{
    const g=(r.sigs.find(x=>x.lt===t)||{}).g||'other';
    return `<span class="badge" style="background:rgba(255,255,255,.06);color:${GC[g]||GC.other}">${esc(t)}</span>`;}).join(' ');
  return `<tr>
    <td><div class="addr1 trunc">${esc(r.a||'—')}</div>
        <div class="addr2 trunc">Indianapolis, IN ${esc(r.z||'')}</div>
        <div class="pcl trunc">${esc(r.p)}</div></td>
    <td><div class="clamp2">${esc(r.o||'—')}</div></td>
    <td><span class="stk ${r.n>=4?'hot':'on'}">${r.n}</span></td>
    <td><div class="trunc">${tw}${r.types.length>3?` <span class="sub">+${r.types.length-3}</span>`:''}</div></td>
    <td class="num-c col-date">${esc(r.recent||'—')}</td>
    <td class="num-c">${money(r.av)}</td>
    <td><button class="view" data-i="${gi}">View</button></td></tr>`;
}
function rowReview(r,i){
  const gi=(page-1)*per+i;
  return `<tr>
    <td><div class="trunc" title="${esc(r.reason)}">${esc(r.reason)}</div></td>
    <td><span class="badge" style="background:rgba(255,255,255,.06);color:var(--muted)">${esc(r.src)}</span></td>
    <td><div class="trunc" title="${esc(r.ref)}">${esc(r.ref||'—')}</div></td>
    <td class="num-c col-amt">${esc(r.cand||'—')}</td>
    <td class="num-c col-date">${esc(r.date||'—')}</td>
    <td><div class="trunc">${esc(r.method||'—')}</div></td>
    <td class="num-c">${r.conf==null?'—':r.conf}</td>
    <td><button class="view" data-i="${gi}">View</button></td></tr>`;
}
function cardSignal(r,i){
  const gi=(page-1)*per+i;
  return `<div class="card"><div class="c1">
      <div><div class="c-addr">${esc(r.a||'—')}</div>
        <div class="addr2">Indianapolis, IN ${esc(r.z||'')}</div></div>
      <span class="badge" style="background:rgba(255,255,255,.06);color:${GC[r.g]||GC.other}">${esc(r.lt)}</span>${isNew(r)?'<span class="new">NEW</span>':''}</div>
    <div class="c-r"><span>Owner</span><span>${esc((r.o||'—').slice(0,34))}</span></div>
    <div class="c-r"><span>Assessed</span><span>${money(r.av)}</span></div>
    <div class="c-r"><span>Date</span><span>${esc(r.d||'—')}</span></div>
    <div class="c-r"><span>Signals</span><span>${r.st}</span></div>
    <button class="view" data-i="${gi}" style="margin-top:9px;width:100%">View details</button></div>`;
}
function cardStack(r,i){
  const gi=(page-1)*per+i;
  return `<div class="card"><div class="c1">
      <div><div class="c-addr">${esc(r.a||'—')}</div><div class="addr2">${esc(r.p)}</div></div>
      <span class="stk ${r.n>=4?'hot':'on'}">${r.n}</span></div>
    <div class="c-r"><span>Owner</span><span>${esc((r.o||'—').slice(0,30))}</span></div>
    <div class="c-r"><span>Assessed</span><span>${money(r.av)}</span></div>
    <div class="c-r"><span>Most recent</span><span>${esc(r.recent||'—')}</span></div>
    <button class="view" data-i="${gi}" style="margin-top:9px;width:100%">View signals</button></div>`;
}
function cardReview(r,i){
  const gi=(page-1)*per+i;
  return `<div class="card">
    <div class="c-addr" style="font-size:14px">${esc(r.reason)}</div>
    <div class="c-r"><span>Source</span><span>${esc(r.src)}</span></div>
    <div class="c-r"><span>Reference</span><span>${esc((r.ref||'—').slice(0,26))}</span></div>
    <div class="c-r"><span>Confidence</span><span>${r.conf==null?'—':r.conf}</span></div>
    <button class="view" data-i="${gi}" style="margin-top:9px;width:100%">View details</button></div>`;
}

function pager(){
  const maxP=Math.max(1,Math.ceil(rows.length/per));
  const from=rows.length?((page-1)*per+1):0, to=Math.min(page*per,rows.length);
  $('pgi').textContent=`${nf(from)}–${nf(to)} of ${nf(rows.length)}`;
  $('pgb').innerHTML=
    `<button class="pbtn" data-p="1"        ${page===1?'disabled':''} aria-label="First page">«</button>`+
    `<button class="pbtn" data-p="${page-1}" ${page===1?'disabled':''} aria-label="Previous page">‹</button>`+
    `<span class="pg-i" style="padding:0 8px">Page ${nf(page)} / ${nf(maxP)}</span>`+
    `<button class="pbtn" data-p="${page+1}" ${page>=maxP?'disabled':''} aria-label="Next page">›</button>`+
    `<button class="pbtn" data-p="${maxP}"   ${page>=maxP?'disabled':''} aria-label="Last page">»</button>`;
}

/* ── DRAWER ── */
function kv(pairs){
  return `<dl class="kv">`+pairs.filter(p=>p[1]!=null&&p[1]!=='')
    .map(p=>`<dt>${esc(p[0])}</dt><dd>${esc(p[1])}</dd>`).join('')+`</dl>`;
}
function sigBlock(x){
  return `<div class="sig"><div class="r1">
      <span class="badge" style="background:rgba(255,255,255,.06);color:${GC[x.g]||GC.other}">${esc(x.lt)}</span>
      <span class="badge" style="background:rgba(255,255,255,.06);color:var(--muted)">${esc(x.sl)}</span>
      <span class="pcl">${esc(x.d||'')}</span></div>
    <div class="r2">${esc(x.inst||'')}${x.note?' · '+esc(x.note):''}${x.amt!=null?' · '+money(x.amt):''}</div></div>`;
}
function openDrawer(i){
  const r=rows[i]; if(!r) return;
  lastFocus=document.activeElement;
  let title, body;
  if(view==='review'){
    title=r.reason||'Review item';
    body=`<div class="grp"><h4>Review</h4>${kv([
      ['Reason',r.reason],['Source',r.src],['Raw reference',r.ref],
      ['Candidate parcel',r.cand],['Date',r.date],['Derivation',r.method],
      ['Confidence',r.conf==null?'—':r.conf],['Detail',r.detail]])}</div>
      <p style="font-size:13px;color:var(--muted)">This record could not be resolved to a parcel.
      It is queued for review rather than dropped.</p>`;
  } else if(view==='stacked'){
    title=r.a||r.p;
    body=`<div class="grp"><h4>Property</h4>${kv([
        ['Address',r.a],['City',`Indianapolis, IN ${r.z||''}`],['State parcel',r.p],
        ['Local parcel',r.pl],['Owner',r.o],['Assessed value',money(r.av)]])}</div>
      <div class="grp"><h4>${r.n} signals on this parcel</h4>
        ${r.sigs.slice().sort((a,b)=>(a.d||'').localeCompare(b.d||'')).map(sigBlock).join('')}</div>`;
  } else {
    title=r.a||r.p||r.lt;
    const others=(byParcel[r.p]||[]).filter(x=>x!==r);
    body=`<div class="grp"><h4>Property</h4>${kv([
        ['Address',r.a],['City',`Indianapolis, IN ${r.z||''}`],['State parcel',r.p],
        ['Local parcel',r.pl],['Owner',r.o],['Assessed value',money(r.av)]])}</div>
      <div class="grp"><h4>Signal</h4>${kv([
        ['Lead type',r.lt],['Source',r.sl],['Date',r.d],['Instrument',r.inst],
        ['Amount',r.amt==null?'':money(r.amt)],['Status',r.note],['Raw doc type',r.rt],
        ['Source record ID',r.rid],['Source role',r.role],
        ['Derivation',r.dm],['Confidence',r.dc==null?'':r.dc],
        ['Backfill',r.bf?'Yes — frozen extract':''],
        ['Coverage',(COV[r.s]||{}).short]])}</div>`+
      (others.length?`<div class="grp"><h4>${others.length} other signal${others.length>1?'s':''} on this parcel</h4>
        ${others.slice().sort((a,b)=>(a.d||'').localeCompare(b.d||'')).map(sigBlock).join('')}</div>`:'')+
      (r.url?`<div class="grp"><h4>Source</h4>
        <a href="${esc(r.url)}" target="_blank" rel="noopener"
           style="color:var(--blue-lt);font-size:13px;word-break:break-all">${esc(r.url)}</a></div>`:'');
  }
  $('drT').textContent=title;
  $('drB').innerHTML=body;
  $('dr').classList.add('on'); $('scrim').classList.add('on');
  $('dr').focus();
}
function closeDrawer(){
  $('dr').classList.remove('on'); $('scrim').classList.remove('on');
  if(lastFocus&&lastFocus.focus) lastFocus.focus();
}
function openModal(){lastFocus=document.activeElement;$('mdl').classList.add('on');$('mdlX').focus();}
function closeModal(){$('mdl').classList.remove('on');if(lastFocus&&lastFocus.focus)lastFocus.focus();}

/* ── CSV ── */
function csvCell(v){
  const s=String(v==null?'':v);
  return /[",\n\r]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s;
}
function download(rowsArr,name){
  const csv=rowsArr.map(r=>r.map(csvCell).join(',')).join('\r\n');
  const blob=new Blob(['﻿'+csv],{type:'text/csv;charset=utf-8;'});
  const u=URL.createObjectURL(blob), a=document.createElement('a');
  a.href=u; a.download=name; document.body.appendChild(a); a.click();
  document.body.removeChild(a); setTimeout(()=>URL.revokeObjectURL(u),1000);
}
function exportView(){
  const d=new Date().toISOString().slice(0,10);
  let head,body,name;
  if(view==='review'){
    name=`marion_review_queue_${d}.csv`;
    head=['Reason','Source','Raw Property Reference','Candidate Parcel','Date','Derivation Method','Confidence','Detail'];
    body=rows.map(r=>[r.reason,r.src,r.ref,r.cand,r.date,r.method,r.conf==null?'':r.conf,r.detail]);
  } else if(view==='stacked'){
    name=`marion_stacked_parcels_${d}.csv`;
    head=['State Parcel','Local Parcel','Address','City','Zip','Owner','Assessed Value',
      'Signal Count','Signal Types','Sources','Most Recent Signal'];
    body=rows.map(r=>[r.p,r.pl,r.a,'Indianapolis',r.z,r.o,r.av==null?'':r.av,r.n,
      r.types.join(' | '),[...new Set(r.sigs.map(x=>x.sl))].join(' | '),r.recent]);
  } else {
    name=`marion_signals_${d}.csv`;
    head=['Lead Type','Source','Coverage','Date','First Seen','Is New','State Parcel','Local Parcel',
      'Address','City','Zip','Owner','Amount','Assessed Value','Signals On Parcel','Instrument',
      'Status','Raw Doc Type','Source Record ID','Derivation','Confidence','Backfill','Source URL'];
    body=rows.map(r=>[r.lt,r.sl,(COV[r.s]||{}).short||'',r.d,r.fs,isNew(r)?'YES':'NO',
      r.p,r.pl,r.a,'Indianapolis',r.z,r.o,
      r.amt==null?'':r.amt,r.av==null?'':r.av,r.st,r.inst,r.note,r.rt,r.rid,r.dm,
      r.dc==null?'':r.dc,r.bf?'YES':'',r.url]);
  }
  download([head,...body],name);
}

/* ── EVENTS ── */
let deb;
$('q').addEventListener('input',()=>{clearTimeout(deb);deb=setTimeout(()=>{page=1;compute();},220);});
['fType','fSrc','avMin','avMax'].forEach(id=>
  $(id).addEventListener('input',()=>{page=1;compute();}));
$('fSort').addEventListener('change',()=>{
  const [k,d]=$('fSort').value.split('_'); sortKey=k; sortDir=d; page=1; compute();});
$('per').addEventListener('change',()=>{per=parseInt($('per').value,10)||50;page=1;compute();});
$('tStack').addEventListener('click',()=>{
  stackOnly=!stackOnly; $('tStack').setAttribute('aria-pressed',String(stackOnly));
  page=1; compute();});
$('tNew').addEventListener('click',()=>{
  newOnly=!newOnly; $('tNew').setAttribute('aria-pressed',String(newOnly));
  page=1; compute();});
$('btnClear').addEventListener('click',()=>{
  $('q').value='';$('fType').value='';$('fSrc').value='';$('avMin').value='';$('avMax').value='';
  $('fSort').value='fs_desc'; sortKey='fs'; sortDir='desc';
  stackOnly=false; $('tStack').setAttribute('aria-pressed','false');
  newOnly=false; $('tNew').setAttribute('aria-pressed','false');
  page=1; compute();});
$('btnExport').addEventListener('click',exportView);
$('btnCov').addEventListener('click',openModal);
$('mdlX').addEventListener('click',closeModal);
$('mdl').addEventListener('click',e=>{if(e.target===$('mdl'))closeModal();});
$('drX').addEventListener('click',closeDrawer);
$('scrim').addEventListener('click',closeDrawer);
$('btnFilters').addEventListener('click',()=>$('bar').classList.toggle('open'));
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){ if($('mdl').classList.contains('on'))closeModal();
    else if($('dr').classList.contains('on'))closeDrawer(); }});

document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>{
  view=b.dataset.v;
  document.querySelectorAll('.tab').forEach(x=>x.setAttribute('aria-selected',String(x===b)));
  page=1;
  // sensible default sort per view; the toolbar stays in sync
  if(view==='review'){sortKey='reason';sortDir='asc';}
  else if(view==='stacked'){sortKey='n';sortDir='desc';}
  else {sortKey='d';sortDir='desc';$('fSort').value='d_desc';}
  rebuildFilterOptions();
  compute();
}));

function rebuildFilterOptions(){
  // Review has its own vocabulary (reasons, not lead types)
  if(view==='review'){
    const rc={}; RV.forEach(r=>rc[r.reason]=(rc[r.reason]||0)+1);
    $('fType').innerHTML='<option value="">All reasons</option>'+
      Object.keys(rc).sort((a,b)=>rc[b]-rc[a])
        .map(k=>`<option value="${esc(k)}">${esc(k)} (${nf(rc[k])})</option>`).join('');
    const sc={}; RV.forEach(r=>sc[r.src]=(sc[r.src]||0)+1);
    $('fSrc').innerHTML='<option value="">All sources</option>'+
      Object.keys(sc).sort((a,b)=>sc[b]-sc[a])
        .map(k=>`<option value="${esc(k)}">${esc(k)} (${nf(sc[k])})</option>`).join('');
  } else {
    const tc={},lbl={}; R.forEach(r=>{tc[r.t]=(tc[r.t]||0)+1;lbl[r.t]=r.lt;});
    $('fType').innerHTML='<option value="">All lead types</option>'+
      Object.keys(tc).sort((a,b)=>tc[b]-tc[a])
        .map(t=>`<option value="${esc(t)}">${esc(lbl[t])} (${nf(tc[t])})</option>`).join('');
    const sc={}; R.forEach(r=>sc[r.s]=(sc[r.s]||0)+1);
    $('fSrc').innerHTML='<option value="">All sources</option>'+
      Object.keys(sc).sort((a,b)=>sc[b]-sc[a])
        .map(s=>`<option value="${esc(s)}">${esc(SL[s]||s)} (${nf(sc[s])})</option>`).join('');
  }
  $('tStack').style.display = view==='signals' ? '' : 'none';
  $('tNew').style.display   = view==='signals' ? '' : 'none';
  $('avMin').style.display = view==='review' ? 'none' : '';
  $('avMax').style.display = view==='review' ? 'none' : '';
}

/* delegated: sort headers, pager, view buttons */
$('th').addEventListener('click',e=>{
  const th=e.target.closest('th[data-k]'); if(!th) return;
  const k=th.dataset.k; if(!k) return;
  if(sortKey===k) sortDir=(sortDir==='asc'?'desc':'asc'); else {sortKey=k;sortDir='asc';}
  compute();});
$('th').addEventListener('keydown',e=>{
  if(e.key==='Enter'||e.key===' '){e.preventDefault();e.target.click();}});
$('pgb').addEventListener('click',e=>{
  const b=e.target.closest('button[data-p]'); if(!b||b.disabled) return;
  const p=parseInt(b.dataset.p,10);
  const maxP=Math.max(1,Math.ceil(rows.length/per));
  if(p>=1&&p<=maxP){page=p;render();window.scrollTo({top:0,behavior:'smooth'});}});
document.addEventListener('click',e=>{
  const b=e.target.closest('button.view'); if(!b) return;
  openDrawer(parseInt(b.dataset.i,10));});

rebuildFilterOptions();
compute();
</script>
</body>
</html>
